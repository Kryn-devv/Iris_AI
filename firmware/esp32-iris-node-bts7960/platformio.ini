; IRIS robot node (2x BTS7960) — PlatformIO project.
; Open THIS FOLDER in VS Code (PlatformIO extension installed),
; plug in the ESP32, click the → Upload arrow in the bottom status bar,
; then the plug icon (Serial Monitor) to read the board's IP.
[platformio]
src_dir = .

[env:esp32dev]
; Pinned deliberately. The sketch selects between two incompatible LEDC APIs on
; ESP_ARDUINO_VERSION_MAJOR (ledcSetup/ledcAttachPin on core 2.x,
; ledcAttach/ledcWrite-by-pin on 3.x), so an unpinned platform means the motor
; PWM back end can change under you on a machine that happens to resolve a
; newer release — with nothing in the build output to say so. Bump this on
; purpose, having read both branches, or not at all.
platform = espressif32@7.0.1       ; -> framework-arduinoespressif32 2.0.17
board = esp32dev
framework = arduino
monitor_speed = 115200

; The WebSockets library is built in its SYNC flavour on ESP32, so its
; read/write/connect all busy-wait on the calling thread — which here is the
; loop task that also runs the ramp and the failsafe. The default budget is
; 5000 ms, so one viewer whose TCP window is full could freeze the motors for
; five seconds. 250 ms is still far longer than any legitimate frame on a LAN.
; The library declares it #ifndef, so this one flag covers the control socket
; and the cloud client alike.
build_flags =
    -DWEBSOCKETS_TCP_TIMEOUT=250

lib_deps =
    links2004/WebSockets@^2.6.1
