; IRIS S3 node (face + sensors) — PlatformIO project.
; Open THIS FOLDER in VS Code (PlatformIO extension installed),
; plug in the S3, click the → Upload arrow in the bottom status bar,
; then the plug icon (Serial Monitor) to read the board's address.
[platformio]
src_dir = .

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; The two OLED eyes. PlatformIO downloads these on the first build.
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.11.11
