; IRIS sensor node (ESP32-S3) — PlatformIO project.
; Open THIS FOLDER in VS Code (PlatformIO extension installed),
; plug in the S3, click the → Upload arrow in the bottom status bar,
; then the plug icon (Serial Monitor) to read the board's IP.
[platformio]
src_dir = .

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
