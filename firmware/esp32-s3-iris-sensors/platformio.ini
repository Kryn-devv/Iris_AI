; IRIS S3 node (face + sensors + voice) — PlatformIO project.
; Open THIS FOLDER in VS Code (PlatformIO extension installed),
; plug in the S3, click the → Upload arrow in the bottom status bar,
; then the plug icon (Serial Monitor) to read the board's address.
[platformio]
src_dir = .

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; PlatformIO downloads these on the first build.
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.11.11
    links2004/WebSockets@^2.6.1
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
