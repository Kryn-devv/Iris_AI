; IRIS robot eye (ESP32-CAM) — PlatformIO project.
; Open THIS FOLDER in VS Code (PlatformIO extension installed), plug the
; camera's MB board in over USB, click the → Upload arrow, then the plug icon
; (Serial Monitor) to read the camera's address.
; Arduino IDE users: ignore this file, see README.md.
[platformio]
src_dir = .

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.partitions = huge_app.csv
build_flags = -DBOARD_HAS_PSRAM
